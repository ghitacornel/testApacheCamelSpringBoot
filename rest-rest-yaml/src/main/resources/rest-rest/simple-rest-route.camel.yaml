- restConfiguration:
    bindingMode: json

# REST must be kept only as a facade
# each REST endpoint must delegate work to another route
- rest:
    path: "simple"
    get:
      - path: "hello"
        produces: "text/plain"
        to: "direct:hello"
      - path: "bye"
        produces: "text/html"
        to: "direct:bye"
      - path: "congrats/{name}"
        param:
          - type: query
            name: title
        produces: "text/plain"
        to: "direct:congrats"
    post:
      - path: ""
        consumes: "application/json"
        produces: "application/json"
        type: org.example.model.RequestDTO
        outType: org.example.model.ResponseDTO
        to: "direct:post"
    delete:
      - path: "{id}"
        to: "direct:delete"

# REST routes
- route:
    from:
      uri: direct:hello
      steps:
        - transform:
            constant:
              expression: Hello World
- route:
    from:
      uri: direct:bye
      steps:
        - transform:
            constant:
              expression: <html><body>Bye World</body></html>
- route:
    from:
      uri: direct:congrats
      steps:
        - log:
            message: GET request query and path param ${header.title} ${header.name}
        - choice:
            when:
              - simple: "${header.title} == null"
                steps:
                  - transform:
                      simple: Congrats ${header.name}
            otherwise:
              steps:
                - transform:
                    simple: Congrats ${header.title} ${header.name}
- route:
    from:
      uri: direct:post
      steps:
        - log: POST request body ${body}
        - bean:
            beanType: org.example.beans.RequestResponseProcessor
        - log: POST response body ${body}
- route:
    from:
      uri: direct:delete
      steps:
        - log: DELETE request path param ${header.id}
        - setBody:
            simple: ${null}
