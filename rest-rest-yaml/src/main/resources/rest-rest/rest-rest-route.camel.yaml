- restConfiguration:
    bindingMode: json
- rest:
    path: "/person"
    get:
      - path: "/hello"
        produces: "text/plain"
        to: "direct:hello"
      - path: "/bye"
        produces: "text/html"
        to: "direct:bye"
      - path: "/congrats/{name}?title={title}"
        produces: "text/plain"
        to: "direct:congrats"
    post:
      - path: "/submit"
        consumes: "application/json"
        produces: "application/json"
        type: org.example.model.RequestDTO
        outType: org.example.model.ResponseDTO
        to: "direct:post"
- route:
    from:
      uri: direct:hello
      steps:
        - transform:
            expression:
              constant:
                expression: Hello World
- route:
    from:
      uri: direct:bye
      steps:
        - transform:
            expression:
              constant:
                expression: <html><body>Bye World</body></html>
- route:
    from:
      uri: direct:congrats
      steps:
        - log:
            message: GET request path and query param ${header.title} ${header.name}
        - choice:
            when:
              - simple: "${header.title} == null"
                steps:
                - transform:
                    expression:
                      simple: Congrats ${header.name}
            otherwise:
              steps:
              - transform:
                  expression:
                    simple: Congrats ${header.title} ${header.name}
- route:
    from:
      uri: direct:post
      steps:
        - log:
            message: POST request body ${body}
        - bean:
            beanType: org.example.beans.RequestResponseProcessor
        - log:
            message: POST response body ${body}