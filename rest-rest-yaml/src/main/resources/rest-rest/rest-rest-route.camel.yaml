- restConfiguration:
    bindingMode: json

# REST must be kept only as a facade
# each REST endpoint must delegate work to another route
- rest:
    path: "/restrest"
    get:
      - path: "/hello"
        produces: "text/plain"
        to: "direct:hello"
      - path: "/bye"
        produces: "text/html"
        to: "direct:bye"
      - path: "/congrats/{name}?title={title}"
        produces: "text/plain"
        to: "direct:congrats"
    post:
      - path: ""
        consumes: "application/json"
        produces: "application/json"
        type: org.example.model.RequestDTO
        outType: org.example.model.ResponseDTO
        to: "direct:post"
    delete:
      - path: "{id}"
        to: "direct:delete"

# REST routes
- route:
    from:
      uri: direct:hello
      steps:
        - to:
            uri: "http://localhost:8080/external/hello?bridgeEndpoint=true"
        - log:
            message: GET external response ${body}
- route:
    from:
      uri: direct:bye
      steps:
        - transform:
            expression:
              constant:
                expression: <html><body>Bye World</body></html>
- route:
    from:
      uri: direct:congrats
      steps:
        - log:
            message: GET request query and path param ${header.title} ${header.name}
        - choice:
            when:
              - simple: "${header.title} == null"
                steps:
                  - transform:
                      expression:
                        simple: Congrats ${header.name}
            otherwise:
              steps:
                - transform:
                    expression:
                      simple: Congrats ${header.title} ${header.name}
- route:
    from:
      uri: direct:post
      steps:
        - log:
            message: POST request body ${body}
        - bean:
            beanType: org.example.beans.RequestResponseProcessor
        - log:
            message: POST response body ${body}
- route:
    from:
      uri: direct:delete
      steps:
        - log:
            message: DELETE request path param ${header.id}
        - setBody:
            simple: ${null}
