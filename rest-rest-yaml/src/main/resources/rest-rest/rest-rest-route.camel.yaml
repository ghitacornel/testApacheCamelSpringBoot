- rest:
    path: "/say"
    get:
      - path: "/hello"
        produces: "text/plain"
        to: "direct:hello"
      - path: "/bye"
        produces: "text/html"
        to: "direct:bye"
      - path: "/congrats/{name}?title={title}"
        produces: "text/plain"
        to: "direct:congrats"
- route:
    from:
      uri: direct:hello
      steps:
        - transform:
            expression:
              constant:
                expression: Hello World
- route:
    from:
      uri: direct:bye
      steps:
        - transform:
            expression:
              constant:
                expression: <html><body>Bye World</body></html>
- route:
    from:
      uri: direct:congrats
      steps:
        - log:
            message: logged path param ${header.title} ${header.name}
        - choice:
            when:
              - simple: "${header.title} == null"
                steps:
                - transform:
                    expression:
                      simple: Congrats ${header.name}
            otherwise:
              steps:
              - transform:
                  expression:
                    simple: Congrats ${header.title} ${header.name}