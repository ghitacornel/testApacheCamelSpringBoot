- rest:
    path: "/say"
    get:
      - path: "/hello"
        produces: "text/plain"
        to: "direct:hello"
      - path: "/bye"
        produces: "text/html"
        to: "direct:bye"
- route:
    from:
      uri: direct:hello
      steps:
        - transform:
            expression:
              constant:
                expression: Hello World
- route:
    from:
      uri: direct:bye
      steps:
        - transform:
            expression:
              constant:
                expression: <html><body>Bye World</body></html>