# REST must be kept only as a facade
# each REST endpoint must delegate work to another route
- rest:
    path: "restrest"
    get:
      - path: "simpleText"
        produces: "text/plain"
        to: "direct:simpleText"
      - path: "simpleHtml"
        produces: "text/html"
        to: "direct:simpleHtml"
      - path: "simpleParameters/{name}"
        param:
          - type: query
            name: title
        produces: "text/plain"
        to: "direct:simpleParameters"
    post:
      - path: ""
        consumes: "application/json"
        produces: "application/json"
        type: org.example.model.RequestDTO
        outType: org.example.model.ResponseDTO
        to: "direct:post"
    delete:
      - path: "{id}"
        to: "direct:delete"

# REST routes
- route:
    from:
      uri: direct:simpleText
      steps:
        - to: "{{app.externalAppUrl}}/simpleText?bridgeEndpoint=true"
        - log: GET external response ${body}
- route:
    from:
      uri: direct:simpleHtml
      steps:
        - to: "{{app.externalAppUrl}}/simpleHtml?bridgeEndpoint=true"
        - log: GET external response ${body}
- route:
    from:
      uri: direct:simpleParameters
      steps:
        - log: GET external request query and path param ${header.title} ${header.name}
        - choice:
            when:
              - simple: "${header.title} == null"
                steps:
                  - toD: "{{app.externalAppUrl}}/simpleParameters/${header.name}?bridgeEndpoint=true"
            otherwise:
              steps:
                - toD: "{{app.externalAppUrl}}/simpleParameters/${header.name}?bridgeEndpoint=true&title=${header.title}"
        - log: GET external response ${body}
- route:
    from:
      uri: direct:post
      steps:
        - log: POST request body ${body}
        - bean:
            beanType: org.example.beans.RequestResponseProcessor
        - log: POST response body ${body}
- route:
    from:
      uri: direct:delete
      steps:
        - log: DELETE request path param ${header.id}
        - setBody:
            simple: ${null}
