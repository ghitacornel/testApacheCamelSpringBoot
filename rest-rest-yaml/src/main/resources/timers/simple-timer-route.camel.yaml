- route:
    # refer to the route configuration by the id to use for this route
    id: "simpleTimerRouteName"
    from:
      uri: "timer:yaml?period=10s&includeMetadata=true"
      steps:
        - setBody:
            simple: "Timer fired ${header.CamelTimerCounter} times"
        - to:
            uri: "log:yaml"
            parameters:
              showBodyType: true
              showExchangePattern: true